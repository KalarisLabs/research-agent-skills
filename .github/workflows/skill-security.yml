name: Skill security

# Scans every file shipped in skills/ (instructions, references, scripts, tests,
# assets) for prompt injection, hidden content and malicious code.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # weekly full rescan with updated rules
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  injection-lint:
    name: Prompt-injection & payload lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - name: Lint skills (fails on new HIGH/MEDIUM findings)
        run: uv run tools/lint_injection.py --sarif reports/injection-lint.sarif
      - name: Upload SARIF
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: reports/injection-lint.sarif
          category: injection-lint

  skill-scanner:
    name: Cisco AI Defense skill-scanner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - name: Scan (static, YARA and behavioral dataflow analyzers; no LLM, no uploads)
        run: |
          mkdir -p reports
          uvx --from cisco-ai-skill-scanner==2.1.0 skill-scanner scan-all skills --recursive --use-behavioral \
            --format json --output reports/skill-scanner.json
          uvx --from cisco-ai-skill-scanner==2.1.0 skill-scanner scan-all skills --recursive --use-behavioral \
            --format sarif --output reports/skill-scanner.sarif
      - name: Gate on new HIGH/CRITICAL findings
        run: uv run tools/skill_scanner_gate.py reports/skill-scanner.json
      - name: Upload SARIF
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: reports/skill-scanner.sarif
          category: skill-scanner
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: skill-scanner-report
          path: reports/
          retention-days: 30

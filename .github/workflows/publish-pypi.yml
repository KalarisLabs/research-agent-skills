name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch: # manual runs are always a dry run (build only, no upload)

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build and Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Build distributions
        run: uv build

      - name: Verify build artifacts
        run: |
          ls -la dist/
          test -f dist/research_agent_skills-*.whl
          test -f dist/research_agent_skills-*.tar.gz

      - name: Publish to PyPI (Dry run)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          uv publish dist/* --token "$UV_PUBLISH_TOKEN" --dry-run

      - name: Publish to PyPI
        if: ${{ github.event_name != 'workflow_dispatch' }}
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          uv publish dist/* --token "$UV_PUBLISH_TOKEN"


name: Vendor security

# Full skill analysis and dependency-policy checks. Enable on main by setting
# the repository variable VENDOR_SCANS_ENABLED=true after adding the two secrets.
# Release calls this workflow unconditionally and fails closed without secrets.
on:
  workflow_call:
    secrets:
      SNYK_TOKEN:
        required: true
      SOCKET_CLI_API_TOKEN:
        required: true
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:
    inputs:
      scanner:
        description: Run both scanners or check one integration
        type: choice
        options: [both, snyk, socket]
        default: both

permissions: {}

jobs:
  snyk-agent-scan:
    name: Snyk Agent Scan (all skills)
    if: >-
      github.event_name == 'workflow_call' ||
      (github.event_name == 'workflow_dispatch' && (inputs.scanner == 'both' || inputs.scanner == 'snyk')) ||
      ((github.event_name == 'push' || github.event_name == 'schedule') && vars.VENDOR_SCANS_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Analyze every skill
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          test -n "$SNYK_TOKEN" || { echo '::error::Set the SNYK_TOKEN repository secret'; exit 1; }
          mkdir -p reports
          uvx --from snyk-agent-scan==0.6.8 snyk-agent-scan scan skills --json > reports/snyk-agent-scan.json
      - name: Require complete coverage and no high or critical risks
        run: python tools/snyk_agent_scan_gate.py reports/snyk-agent-scan.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: snyk-agent-scan-report
          path: reports/snyk-agent-scan.json
          retention-days: 30

  socket:
    name: Socket dependency policy
    if: >-
      github.event_name == 'workflow_call' ||
      (github.event_name == 'workflow_dispatch' && (inputs.scanner == 'both' || inputs.scanner == 'socket')) ||
      ((github.event_name == 'push' || github.event_name == 'schedule') && vars.VENDOR_SCANS_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Require Socket API token
        env:
          SOCKET_CLI_API_TOKEN: ${{ secrets.SOCKET_CLI_API_TOKEN }}
        run: test -n "$SOCKET_CLI_API_TOKEN" || { echo '::error::Set the SOCKET_CLI_API_TOKEN repository secret'; exit 1; }
      - name: Scan dependency manifests against Socket policy
        env:
          SOCKET_CLI_API_TOKEN: ${{ secrets.SOCKET_CLI_API_TOKEN }}
        run: npx --yes socket@1.4.1 ci

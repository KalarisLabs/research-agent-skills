name: Release

# Tag vX.Y.Z (matching VERSION and cli/package.json) to publish:
#   * research-agent-skills-X.Y.Z.tar.gz + SHA256SUMS (installers verify these)
#   * GitHub build-provenance attestation (SLSA) for the tarball, also attached
#     as <name>.intoto.jsonl so verifiers (and OpenSSF Scorecard) can find it
#   * Sigstore keyless signature bundle for SHA256SUMS
#   * npm package `research-agent-skills` with provenance (trusted publishing / OIDC)

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  vendor-security:
    name: Vendor security gate
    permissions:
      contents: read
    if: vars.VENDOR_SCANS_ENABLED == 'true'
    uses: ./.github/workflows/vendor-security.yml
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      SOCKET_CLI_API_TOKEN: ${{ secrets.SOCKET_CLI_API_TOKEN }}

  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false   # never restore caches into release builds
      - name: Tag matches VERSION and cli/package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#v}"
          test "$v" = "$(cat VERSION)"
          test "$v" = "$(node -p "require('./cli/package.json').version")"
      - name: Tag commit belongs to protected main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: uv sync --locked
      - run: uv run tools/validate.py --quiet
      - run: uv run tools/build_catalog.py --check
      - run: uv run tools/brand_guard.py
      - run: uv run tools/lint_injection.py
      - name: Scan shipped skills with Cisco AI Defense
        run: |
          mkdir -p reports
          uvx --from cisco-ai-skill-scanner==2.1.0 skill-scanner scan-all skills --recursive --use-behavioral \
            --format json --output reports/skill-scanner.json
          uv run tools/skill_scanner_gate.py reports/skill-scanner.json
      - run: uv run python -m pytest -q
      - working-directory: cli
        run: npm ci --ignore-scripts && npm test

  build:
    name: Build, attest and sign
    needs: [verify, vendor-security]
    if: >-
      !cancelled() && needs.verify.result == 'success' &&
      (needs.vendor-security.result == 'success' || needs.vendor-security.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write      # create the GitHub release
      id-token: write      # Sigstore + attestations (OIDC)
      attestations: write
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build tarball and checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#v}"
          mkdir -p dist
          git archive --format=tar.gz --prefix="research-agent-skills-$v/" -o "dist/research-agent-skills-$v.tar.gz" "$TAG" -- . ':(exclude).github' ':(exclude)tests' ':(exclude)docs' ':(exclude)cli' ':(exclude)evals'
          (cd dist && sha256sum "research-agent-skills-$v.tar.gz" > SHA256SUMS && cat SHA256SUMS)
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/research-agent-skills-*.tar.gz
      - name: Publish SLSA provenance as a release asset
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          TAG: ${{ github.ref_name }}
        run: cp "$BUNDLE" "dist/research-agent-skills-${TAG#v}.intoto.jsonl"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign SHA256SUMS (keyless)
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "Research Agent Skills $TAG" --generate-notes --verify-tag

  npm:
    name: Publish CLI to npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write      # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false   # never restore caches into release builds
          registry-url: https://registry.npmjs.org
      - working-directory: cli
        run: |
          npm install --global npm@11.15.0
          npm ci --ignore-scripts
          npm run build
          if npm view "research-agent-skills@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "::notice::This npm version was already published during the one-time bootstrap"
          else
            npm publish --provenance --access public
          fi

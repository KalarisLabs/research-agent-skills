name: Skill Scorecard Comment

# Companion workflow to post scorecard comments for external fork PRs.
# Runs in the repository context with write permissions to post PR comments
# without exposing write tokens or secrets to untrusted code.

on:
  workflow_run:
    workflows: ["Skill Scorecard"]
    types: [completed]

permissions: {}

jobs:
  post-comment:
    name: Post scorecard PR comment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      actions: read
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Download scorecard artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p reports
          gh run download "${{ github.event.workflow_run.id }}" \
            --name skill-scorecard-report \
            --dir reports || {
              echo "No scorecard report artifact found for run ${{ github.event.workflow_run.id }}"
              exit 0
            }
      - name: Post or update sticky comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -f reports/pr_number.txt ] && [ -f reports/scorecard.md ]; then
            PR_NUM=$(cat reports/pr_number.txt | tr -d '[:space:]')
            if [ -n "$PR_NUM" ] && [ "$PR_NUM" != "null" ]; then
              echo "Posting/updating scorecard comment on PR #$PR_NUM"
              uv run tools/skill_scorecard.py --post-comment-file reports/scorecard.md --pr-number "$PR_NUM"
            else
              echo "PR number not found or not a pull request event. Skipping comment."
            fi
          else
            echo "Scorecard report files missing. Skipping comment."
          fi

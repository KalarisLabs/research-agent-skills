name: Deploy Skills Catalog to skills.kalarislabs.com

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "catalog/skills.json"
      - "skills/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-catalog
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Sync latest catalog to web
        run: |
          mkdir -p web
          cp catalog/skills.json web/skills.json
          echo "skills.kalarislabs.com" > web/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


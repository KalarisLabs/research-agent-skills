name: Install stats

# Refreshes the README "Most installed" table and catalog/installs.json from skills.sh,
# then opens (or updates) a pull request. No pull request when counts are unchanged.

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh skills.sh install counts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # push the bot/install-stats branch
      pull-requests: write   # open the pull request
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install tooling
        run: uv sync --locked
      - name: Fetch install counts
        run: uv run tools/update_install_stats.py
      - name: Open or update pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: bot/install-stats
        run: |
          if git diff --quiet -- README.md catalog/installs.json && [ -z "$(git status --porcelain -- catalog/installs.json)" ]; then
            echo "Install counts unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add README.md catalog/installs.json
          git commit -m "docs: refresh skills.sh install counts"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
          if ! gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr create --head "$BRANCH" --base main \
              --title "docs: refresh skills.sh install counts" \
              --body "Weekly refresh of the README \"Most installed\" table and \`catalog/installs.json\` from https://www.skills.sh/kalarislabs/research-agent-skills. Generated by \`.github/workflows/install-stats.yml\`."
          fi

[project]
name = "research-agent-skills-tools"
version = "1.0.0"
description = "Tooling for the Research Agent Skills repository (validation, import, catalog, security lint)."
readme = "README.md"
license = "MIT"
authors = [{ name = "Sayan Chowdhury" }, { name = "Kalaris Labs" }]
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0.2"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]
docs = ["mkdocs-material>=9.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["skills", ".cache", "cli", "node_modules", "site"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S603", "S607", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
